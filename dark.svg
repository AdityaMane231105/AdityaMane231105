<svg width="1180" height="610" viewBox="0 0 1180 610"
     fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Aditya Mane — UI/UX & Graphic Designer, Frontend Developer, Cybersecurity Enthusiast">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="220" y1="100" x2="900" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#FFFFFF"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

    <!-- Clip -->
    <clipPath id="mainClip">
      <rect x="1" y="1" width="1178" height="608" rx="20"/>
    </clipPath>

    <!-- Animation -->
    <style>
      .fade {
        animation: fadeIn 1.2s ease-out both;
      }

      .delay1 {
        animation-delay: .15s;
      }

      .delay2 {
        animation-delay: .3s;
      }

      .delay3 {
        animation-delay: .45s;
      }

      .delay4 {
        animation-delay: .6s;
      }

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }

      .scan {
        animation: scan 5s linear infinite;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,100% {
          opacity: .45;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      @keyframes scan {
        0% {
          transform: translateY(-610px);
          opacity: 0;
        }
        15% {
          opacity: .35;
        }
        50% {
          opacity: .12;
        }
        100% {
          transform: translateY(610px);
          opacity: 0;
        }
      }
    </style>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect width="1180" height="610" rx="20" fill="url(#bg)"/>

  <g clip-path="url(#mainClip)">
    <rect width="1180" height="610" fill="url(#grid)"/>

    <!-- Ambient glow -->
    <circle cx="130" cy="120" r="150"
            fill="#22D3EE"
            fill-opacity="0.035"
            filter="url(#glowCyan)"/>

    <circle cx="1040" cy="480" r="190"
            fill="#7C3AED"
            fill-opacity="0.045"
            filter="url(#glowPurple)"/>

    <!-- subtle scan -->
    <rect x="0" y="0" width="1180" height="2"
          fill="url(#accent)"
          opacity="0.25"
          class="scan"/>
  </g>


  <!-- ========================================================= -->
