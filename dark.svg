<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#0b0718"/>
    </linearGradient>

    <!-- Premium gradient -->
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow gradient -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#94a3b8"
            stroke-opacity=".045"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Clip -->
    <clipPath id="clip">
      <rect width="1180"
            height="610"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect width="1180"
        height="610"
        rx="20"
        fill="url(#bg)"/>

  <rect width="1180"
        height="610"
        rx="20"
        fill="url(#grid)"/>


  <!-- Ambient glow -->
  <circle cx="90"
          cy="100"
          r="240"
          fill="url(#cyanGlow)">

    <animate attributeName="opacity"
             values=".45;.8;.45"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>


  <circle cx="1090"
          cy="520"
