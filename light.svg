<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>

    <!-- Premium gradient -->
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#64748b"
            stroke-opacity=".055"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Clip -->
    <clipPath id="clip">
      <rect width="1180"
            height="610"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect width="1180"
        height="610"
        rx="20"
        fill="url(#bg)"/>

  <rect width="1180"
        height="610"
        rx="20"
        fill="url(#grid)"/>


  <!-- Ambient cyan -->

  <circle cx="90"
          cy="100"
          r="240"
          fill="url(#cyanGlow)">

    <animate attributeName="opacity"
             values=".5;.9;.5"
